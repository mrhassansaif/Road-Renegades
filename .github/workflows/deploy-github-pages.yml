name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Project site: https://mrhassansaif.github.io/Road-Renegades/
          NEXT_PUBLIC_BASE_PATH: /Road-Renegades

      - name: Verify export output
        run: |
          test -f out/index.html
          test -f out/about/index.html
          test -f out/services/index.html
          test -f out/gallery/index.html
          test -f out/testimonials/index.html
          test -f out/contact/index.html
          test -f out/faq/index.html
          test -f out/.nojekyll
          test -d out/_next

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
